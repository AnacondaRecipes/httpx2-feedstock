{% set name = "httpx2" %}
{% set version = "2.16.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0d54c98128e8f2ff7fbbde0fca8c359e5f032edeaaaac443cdb7f31f685bcd7f

build:
  skip: true # [py<311]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  entry_points:
    - httpx2 = httpx2._main:main

requirements:
  host:
    - hatch-fancy-pypi-readme
    - hatchling
    - pip
    - python
    - uv-dynamic-versioning >=0.14.1
  run:
    - python
    - truststore >=0.10
    - httpcore2 =={{ version }}
    - anyio >=4.10
    - idna >=3.18
    - typing_extensions >=4.5.0 # [py<313]
  run_constrained:
    # brotli
    - brotli >=1.2.0
    # cli
    - click >=8.4.2
    - pygments ==2.*
    - rich >=10,<16
    # http2
    - h2 >=3,<5
    # socks
    - socksio ==1.*
    # wsproto
    - wsproto >=1.2
    # zstd
    - backports.zstd >=1.0.0  # [py<314]

test:
  imports:
    - httpx2
    - httpx2.websockets
  requires:
    - pip
    - click >=8.4.2
    - pygments 2.*
    - rich >=10,<16
    - wsproto
  commands:
    - pip check
    - httpx2 --help
    # Upstream tests are not included in the PyPI sdist; only smoke tests can run.

about:
  home: https://github.com/pydantic/httpx2
  summary: The next generation HTTP client.
  description: |
    HTTPX2 is a fully featured HTTP client library for Python. It includes an
    integrated command line client, has support for both HTTP/1.1 and HTTP/2,
    and provides both sync and async APIs.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  dev_url: https://github.com/pydantic/httpx2
  doc_url: https://pydantic.dev/docs/httpx2/get-started/

extra:
  recipe-maintainers:
    - bollwyvl
    - Kludex